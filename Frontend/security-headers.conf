# En-têtes de sécurité des pages de l'application (inclus dans chaque bloc
# location qui sert des fichiers statiques : un add_header dans un location
# annule ceux du niveau server). Les réponses de l'API ont les leurs (helmet).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Une fois l'application servie en HTTPS, ajouter :
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
