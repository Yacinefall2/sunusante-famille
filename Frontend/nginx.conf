server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy des appels API vers le service backend (réseau Docker interne)
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M; # doit couvrir la limite définie côté backend (15 Mo)
    }

    # Proxy des fichiers uploadés (documents médicaux) vers le backend
    location /uploads/ {
        proxy_pass http://backend:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Routage SPA React Router : toute route inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets buildés (hashés par Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}