server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Compression des fichiers statiques texte (JS, CSS, JSON, SVG) : pages
    # plus rapides sur les connexions mobiles lentes. Les réponses de l'API ne
    # sont volontairement pas compressées (« gzip off » dans location /api/) :
    # compresser des données de santé avec du contenu choisi par un tiers
    # ouvre la porte aux attaques de type BREACH sous HTTPS.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # Résolution DNS de Docker, relue régulièrement : si le backend redémarre
    # et change d'adresse IP, nginx la retrouve. Sans cela, nginx garde
    # l'adresse lue à son démarrage et renvoie des erreurs 502 (connexion
    # impossible) jusqu'à son propre redémarrage.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:4000;

    # Proxy des appels API vers le service backend (réseau Docker interne).
    # Avec une variable, proxy_pass transmet l'URI d'origine telle quelle.
    # Host : $http_host (nom ET port demandés par le navigateur) et non $host
    # (nom seul) — le backend compare l'en-tête Origin à cet hôte ; sans le
    # port, toute modification était refusée (« Origine refusée ») dès que
    # l'adresse utilisée n'était pas exactement FRONTEND_URL.
    # X-Forwarded-For : adresse réelle du visiteur, utilisée par le backend
    # pour ses limites par adresse IP (trust proxy).
    location /api/ {
        gzip off;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M; # doit couvrir la limite définie côté backend (15 Mo)
    }

    # Proxy des fichiers uploadés (documents médicaux) vers le backend
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Routage SPA React Router : toute route inconnue renvoie index.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # index.html ne doit jamais être resservi depuis le cache sans demander
    # au serveur : il désigne les fichiers JS/CSS de la version en cours. Sans
    # cette règle, le navigateur gardait l'ancien index.html (et donc
    # l'ancienne application) jusqu'à un rechargement manuel (F5).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Cache long pour les assets buildés (hashés par Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
