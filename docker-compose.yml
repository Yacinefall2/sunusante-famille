services:
  db:
    image: postgres:16-alpine
    container_name: santefamille-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Obligatoire (fichier .env) : pas de mot de passe par défaut connu de tous.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?La variable POSTGRES_PASSWORD est requise — voir .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-santefamille}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Accessible depuis cette machine seulement (outils de débogage), jamais
    # depuis le réseau.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-santefamille}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Base jetable pour les tests automatisés du backend (npm test). Ne démarre
  # qu'avec le profil "test" : docker compose --profile test up -d db-test
  # Port 15432 : hors de la plage de ports que Windows attribue automatiquement
  # aux applications (49152-65535) et différent d'un PostgreSQL local (5432).
  db-test:
    image: postgres:16-alpine
    container_name: santefamille-db-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"

  # Outils de développement, démarrés seulement avec le profil « dev » :
  # docker compose --profile dev up. Accessibles depuis cette machine seulement.
  pgadmin:
    image: dpage/pgadmin4
    container_name: santefamille-pgadmin
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@santefamille.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?La variable PGADMIN_PASSWORD est requise — voir .env.example}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"

  # Boîte de test : elle montre tous les liens envoyés (réinitialisation,
  # invitations...), d'où le profil « dev » et l'accès local uniquement.
  mailhog:
    image: mailhog/mailhog
    container_name: santefamille-mailhog
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILHOG_SMTP_PORT:-1025}:1025" # serveur SMTP (utilisé par le backend)
      - "127.0.0.1:${MAILHOG_UI_PORT:-8025}:8025" # interface web pour consulter les emails "envoyés"

  # Le backend tourne sous l'utilisateur « node » (non root) : ce service
  # d'une seconde, lancé avant lui, rend le volume des fichiers téléversés
  # inscriptible par cet utilisateur (utile pour un volume créé par une
  # version précédente, quand le backend tournait en root).
  uploads-permissions:
    build: ./Backend
    container_name: santefamille-uploads-permissions
    user: root
    entrypoint: ["chown", "-R", "node:node", "/app/uploads"]
    restart: "no"
    volumes:
      - uploads_data:/app/uploads

  backend:
    build: ./Backend
    container_name: santefamille-backend
    restart: unless-stopped
    environment: &backend-env
      PORT: 4000
      # production par défaut (image Docker). Impose des secrets JWT forts et
      # COOKIE_SECURE=true (voir DOCUMENTATION.md, « Sécurité en production »).
      NODE_ENV: ${NODE_ENV:-production}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Dakar}
      MAIL_WEBHOOK_SECRET: ${MAIL_WEBHOOK_SECRET:-}
      EMERGENCY_TOKEN_KEY: ${EMERGENCY_TOKEN_KEY:-}
      # Espace support : chiffrement des secrets du double facteur (facultatif,
      # dérivé de JWT_ACCESS_SECRET à défaut) et adresse « Répondre à ».
      SUPPORT_TOTP_KEY: ${SUPPORT_TOTP_KEY:-}
      SUPPORT_CONTACT_EMAIL: ${SUPPORT_CONTACT_EMAIL:-}
      # Clé maîtresse du chiffrement des documents (backend ET worker, qui
      # prépare les archives d'export). Obligatoire : sa perte rend les
      # documents irrécupérables — à sauvegarder à part (voir .env.example).
      DOCUMENTS_ENCRYPTION_KEY: ${DOCUMENTS_ENCRYPTION_KEY:?La variable DOCUMENTS_ENCRYPTION_KEY est requise — voir .env.example}
      DOCUMENTS_ENCRYPTION_KEY_PREVIOUS: ${DOCUMENTS_ENCRYPTION_KEY_PREVIOUS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?La variable POSTGRES_PASSWORD est requise — voir .env.example}@db:5432/${POSTGRES_DB:-santefamille}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?La variable JWT_ACCESS_SECRET est requise — voir .env.example}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?La variable JWT_REFRESH_SECRET est requise — voir .env.example}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-SunuSanté Famille <no-reply@santefamille.local>}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # Notifications push (application installable) — facultatives : vides,
      # le push est désactivé (avertissement au démarrage), le reste
      # fonctionne. Générer : npx web-push generate-vapid-keys (voir .env.example).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    depends_on:
      db:
        condition: service_healthy
      uploads-permissions:
        condition: service_completed_successfully
    # Le navigateur passe par le frontend (/api) : l'API n'est ouverte
    # directement que sur cette machine.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    volumes:
      - uploads_data:/app/uploads

  # Moteur de rappels et de notifications (phase D) : même image que le
  # backend, passe toutes les minutes. Démarre une fois le backend prêt (les
  # migrations sont alors appliquées).
  worker:
    build: ./Backend
    container_name: santefamille-worker
    restart: unless-stopped
    entrypoint: ["node", "worker.js"]
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy
    # Volume des fichiers : le worker prépare les archives de la famille
    # (UC-09, uploads/exports/) avec les documents, et efface celles dont le
    # lien a expiré.
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(Date.now() - Number(require('fs').readFileSync('/tmp/worker-heartbeat', 'utf8')) < 180000 ? 0 : 1)"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build: ./Frontend
    container_name: santefamille-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  db_data:
  uploads_data: