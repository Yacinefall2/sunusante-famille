services:
  db:
    image: postgres:16-alpine
    container_name: santefamille-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-santefamille}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-santefamille}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Base jetable pour les tests automatisés du backend (npm test). Ne démarre
  # qu'avec le profil "test" : docker compose --profile test up -d db-test
  # Port 55432 pour ne jamais entrer en conflit avec un PostgreSQL local.
  db-test:
    image: postgres:16-alpine
    container_name: santefamille-db-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "55432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: santefamille-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@santefamille.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5050:80"

  mailhog:
    image: mailhog/mailhog
    container_name: santefamille-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # serveur SMTP (utilisé par le backend)
      - "8025:8025" # interface web pour consulter les emails "envoyés"

  backend:
    build: ./Backend
    container_name: santefamille-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-santefamille}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?La variable JWT_ACCESS_SECRET est requise — voir .env.example}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?La variable JWT_REFRESH_SECRET est requise — voir .env.example}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-SunuSanté Famille <no-reply@santefamille.local>}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./Frontend
    container_name: santefamille-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
  uploads_data: